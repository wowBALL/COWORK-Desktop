<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>COWORK Widget</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
  :root{
    --bg:#161821;--panel:#1e2130;--panel-2:#242838;--line:#2c3040;--line-soft:#22252f;
    --ink:#dfe3f0;--muted:#9aa0b8;--dim:#666c85;
    --accent:#7aa2f7;--green:#8fcf7a;--amber:#e0af68;--rose:#e97a8c;--cyan:#67c9dc;--violet:#a98bf0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:transparent;overflow:hidden}
  body{font-family:'Sarabun',system-ui,sans-serif;padding:10px}
  .shell{
    height:100%;border-radius:16px;overflow:hidden;position:relative;
    background:var(--bg);
    border:1px solid var(--line);
    box-shadow:0 18px 44px rgba(0,0,0,.5);
    display:flex;flex-direction:column;color:var(--ink);
  }
  /* drag handle */
  .bar{-webkit-app-region:drag;display:flex;align-items:center;justify-content:space-between;
    padding:12px 14px;gap:8px;flex-shrink:0;border-bottom:1px solid var(--line-soft)}
  .bar .title{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .ctrls{-webkit-app-region:no-drag;display:flex;gap:6px}
  .ctrls button{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:var(--panel);
    color:var(--muted);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:.15s}
  .ctrls button:hover{color:var(--ink);border-color:var(--accent)}
  .ctrls button.on{background:var(--accent);color:#161821;border-color:var(--accent)}
  .body{flex:1;overflow-y:auto;padding:6px 16px 16px;-webkit-app-region:no-drag}
  .body::-webkit-scrollbar{width:6px}.body::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

  .clock{font-family:'JetBrains Mono',monospace;font-size:44px;font-weight:700;line-height:1;letter-spacing:-.02em}
  .clock .sec{color:var(--accent);font-size:.4em;vertical-align:super}
  .date{color:var(--muted);font-size:13px;margin-top:6px}
  .greet{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin-bottom:2px}

  h3{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:18px 0 10px}

  .row-label{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:5px}
  .hint{font-size:12px;color:var(--dim);padding:6px 0}

  /* project filter — multi-select chips */
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
  .chip{-webkit-app-region:no-drag;font-size:10.5px;font-weight:600;color:var(--muted);background:var(--panel);
    border:1px solid var(--line);border-radius:7px;padding:4px 9px;cursor:pointer;transition:.12s;
    display:flex;align-items:center;gap:5px}
  .chip:hover{border-color:var(--accent);color:var(--ink)}
  .chip.active{color:#161821;background:var(--accent);border-color:var(--accent)}
  .chip .n{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;color:var(--ink);
    background:rgba(0,0,0,.28);border-radius:20px;padding:1px 6px}
  .chip.active .n{color:#161821;background:rgba(22,24,33,.22)}

  /* status tabs — single-select, color-coded */
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .tab{-webkit-app-region:no-drag;font-size:11px;font-weight:600;color:var(--muted);background:transparent;
    border:1px solid var(--line);border-radius:7px;padding:5px 11px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.12s}
  .tab .dot{width:7px;height:7px;border-radius:50%;background:var(--sc,var(--dim));flex-shrink:0}
  .tab .n{font-size:9px;font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--ink);
    background:rgba(0,0,0,.28);border-radius:20px;padding:1px 6px}
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--ink);background:var(--panel-2);border-color:var(--sc,var(--accent))}
  .tab.active .n{color:var(--muted)}

  /* task rows */
  .task{display:flex;align-items:center;gap:10px;padding:10px 8px;cursor:pointer;transition:.12s;
    border-bottom:1px solid var(--line-soft)}
  .task:last-child{border-bottom:none}
  .task:hover{background:var(--panel);border-radius:8px;border-bottom-color:transparent}
  .idnum{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);flex-shrink:0;width:36px}
  .t{flex:1;font-size:13px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .proj{font-size:10px;font-weight:600;padding:2px 8px;border-radius:6px;flex-shrink:0;
    max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .who{font-size:10.5px;font-weight:600;flex-shrink:0;max-width:88px;padding:2px 8px;border-radius:6px;
    border:1px solid currentColor;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .risk{font-size:8.5px;font-weight:700;letter-spacing:.02em;padding:2px 7px;border-radius:6px;
    flex-shrink:0;width:66px;text-align:center;text-transform:uppercase}
  .risk.rk-none{background:transparent;color:var(--line);border:1px dashed var(--line)}
  .rk0{background:rgba(143,207,122,.16);color:#9ed687}   /* Low */
  .rk1{background:rgba(103,201,220,.16);color:#7fd3e4}   /* Fairly Low */
  .rk2{background:rgba(224,175,104,.16);color:#e8bd76}   /* Moderate */
  .rk3{background:rgba(240,150,90,.18);color:#f0a35f}    /* Medium */
  .rk4{background:rgba(233,90,110,.20);color:#f56b82}    /* High */
  /* project pill palette (muted, curated) */
  .pc0{background:rgba(122,162,247,.16);color:#9bbcff}
  .pc1{background:rgba(143,207,122,.16);color:#a6dd93}
  .pc2{background:rgba(224,175,104,.16);color:#e8c184}
  .pc3{background:rgba(233,122,140,.16);color:#f096a4}
  .pc4{background:rgba(103,201,220,.16);color:#87d6e6}
  .pc5{background:rgba(169,139,240,.16);color:#bda6f5}
  /* assignee name colour (text only, same hue family) */
  .wc0{color:#9bbcff}.wc1{color:#a6dd93}.wc2{color:#e8c184}
  .wc3{color:#f096a4}.wc4{color:#87d6e6}.wc5{color:#bda6f5}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
  .stats.w5{grid-template-columns:repeat(5,1fr)}
  .stat{background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;padding:11px 6px;text-align:center;position:relative;overflow:hidden}
  .stat::before{content:"";position:absolute;inset:0 auto auto 0;width:100%;height:2px;background:var(--sc,var(--accent));opacity:.5}
  .stat .n{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;color:var(--sc,var(--accent))}
  .stat .l{font-size:9px;color:var(--muted);margin-top:2px;text-transform:uppercase}

  /* ---- Workspace tab ---- */
  .navrow{-webkit-app-region:no-drag;display:flex;align-items:center;gap:6px;
    padding:8px 16px;border-bottom:1px solid var(--line-soft);flex-shrink:0}
  .navrow .seg{display:flex;gap:4px}
  .navrow .seg button{font-family:inherit;font-size:11px;font-weight:600;color:var(--muted);background:transparent;
    border:1px solid var(--line);border-radius:8px;padding:5px 13px;cursor:pointer;transition:.15s}
  .navrow .seg button:hover{color:var(--ink);border-color:var(--accent)}
  .navrow .seg button.on{background:var(--accent);color:#161821;border-color:var(--accent)}
  .navrow .refresh{margin-left:auto;width:26px;height:26px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel);color:var(--muted);cursor:pointer;font-size:12px;transition:.15s}
  .navrow .refresh:hover{color:var(--ink);border-color:var(--accent)}
  .chip .dot{width:7px;height:7px;border-radius:50%;background:var(--cc,var(--dim));flex-shrink:0}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  .card{background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;padding:13px 14px;
    cursor:pointer;transition:.14s;position:relative;overflow:hidden}
  .card:hover{border-color:var(--accent);background:var(--panel-2);transform:translateY(-1px)}
  .card .ctop{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .card .sdot{width:9px;height:9px;border-radius:50%;background:var(--sc);flex-shrink:0;
    box-shadow:0 0 0 3px color-mix(in srgb,var(--sc) 22%,transparent)}
  .card .name{font-size:14px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .vis{font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;flex-shrink:0}
  .vis.pub{background:rgba(103,201,220,.16);color:#87d6e6}
  .vis.prv{background:rgba(169,139,240,.16);color:#bda6f5}
  .card .path{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:9px}
  .card .desc{font-size:11.5px;color:var(--muted);line-height:1.45;margin-bottom:10px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:33px}
  .card .desc.none{color:var(--dim);font-style:italic}
  .card .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;
    border-top:1px solid var(--line-soft);padding-top:8px}
  .card .stag{font-size:10px;font-weight:600;color:var(--sc)}
  .card .upd{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--dim)}

  .feed{display:flex;flex-direction:column;gap:2px}
  .day{margin-bottom:6px}
  .day .dhead{display:flex;align-items:center;gap:9px;margin:6px 0 8px}
  .day .ddate{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--accent)}
  .day .dsub{font-size:10px;color:var(--dim)}
  .entry{display:flex;gap:11px;padding:2px 0 12px;cursor:pointer}
  .entry:hover .ptext{color:var(--ink)}
  .entry .rail{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:10px}
  .entry .rail .pin{width:9px;height:9px;border-radius:50%;background:var(--pc,var(--accent));margin-top:4px;flex-shrink:0}
  .entry .rail .ln{flex:1;width:2px;background:var(--line-soft);margin-top:3px}
  .entry:last-child .rail .ln{display:none}
  .entry .content{flex:1}
  .entry .pname{font-size:12px;font-weight:700;color:var(--pc,var(--ink));margin-bottom:3px}
  .entry .ptext{font-size:12px;color:var(--muted);line-height:1.5;transition:.12s}

  .lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
  .lcard{background:var(--panel);border:1px solid var(--line-soft);border-radius:11px;padding:12px 14px;cursor:pointer;transition:.14s}
  .lcard:hover{border-color:var(--amber);background:var(--panel-2)}
  .lcard.pb:hover{border-color:var(--green)}
  .lcard .lt{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .lcard .badge{font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px}
  .badge.les{background:rgba(224,175,104,.16);color:#e8c184}
  .badge.pbk{background:rgba(143,207,122,.16);color:#a6dd93}
  .lcard .ldate{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--dim);margin-left:auto}
  .lcard .lname{font-size:13px;font-weight:600;line-height:1.35;margin-bottom:5px}
  .lcard .lmeta{font-size:11px;color:var(--muted);line-height:1.4}
  .empty{font-size:12px;color:var(--dim);padding:10px 2px;border:1px dashed var(--line);border-radius:10px;text-align:center}
  .hidden{display:none}
</style>
</head>
<body>
  <div class="shell">
    <div class="bar">
      <span class="title">◈ COWORK</span>
      <div class="ctrls">
        <button id="pin" title="ปักหมุดบนสุด">📌</button>
        <button id="max" title="ขยายเต็มจอ / คืนขนาด">⛶</button>
        <button id="close" title="ปิด">✕</button>
      </div>
    </div>
    <div class="navrow">
      <div class="seg">
        <button id="navRedmine" class="on">Redmine</button>
        <button id="navWorkspace">Workspace</button>
      </div>
      <button id="wsRefresh" class="refresh hidden" title="โหลด Workspace ใหม่">↻</button>
    </div>

    <div class="body">
      <!-- ===== Redmine view ===== -->
      <div id="redmineView">
        <div class="greet" id="greet">—</div>
        <div class="clock"><span id="hm">--:--</span><span class="sec" id="s">00</span></div>
        <div class="date" id="date">—</div>

        <h3>งาน Redmine</h3>
        <div class="row-label">โปรเจกต์ · เลือกได้หลายอัน</div>
        <div id="projectFilter" class="chips"></div>
        <div class="row-label">ผู้รับผิดชอบ · เลือกได้หลายคน</div>
        <div id="assigneeFilter" class="chips"></div>
        <div class="row-label">สถานะ</div>
        <div id="tabs" class="tabs"></div>
        <div id="tasks"><div class="hint">กำลังโหลด...</div></div>

        <h3>ภาพรวม vault</h3>
        <div class="stats">
          <div class="stat"><div class="n">7</div><div class="l">proj</div></div>
          <div class="stat"><div class="n">398</div><div class="l">node</div></div>
          <div class="stat"><div class="n">575</div><div class="l">edge</div></div>
          <div class="stat"><div class="n">12</div><div class="l">todo</div></div>
        </div>
      </div>

      <!-- ===== Workspace view ===== -->
      <div id="workspaceView" class="hidden">
        <h3>ภาพรวม Workspace</h3>
        <div id="wsStats" class="stats w5"></div>

        <h3>โปรเจกต์</h3>
        <div class="row-label">การมองเห็น</div>
        <div id="wsVis" class="chips"></div>
        <div class="row-label">สถานะ</div>
        <div id="wsStatus" class="chips"></div>
        <div id="wsProjects" class="grid"><div class="hint">กำลังโหลด...</div></div>

        <h3>บันทึกรายวันล่าสุด</h3>
        <div id="wsFeed" class="feed"></div>

        <h3>บทเรียน &amp; แผนรับมือ</h3>
        <div id="wsKnow" class="lgrid"></div>
      </div>
    </div>
  </div>

<script>
  const D=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
  const M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  function tick(){
    const n=new Date(),p=x=>String(x).padStart(2,'0'),h=n.getHours();
    hm.textContent=`${p(h)}:${p(n.getMinutes())}`; s.textContent=p(n.getSeconds());
    greet.textContent=(h<12?'Good morning':h<18?'Good afternoon':'Good evening')+', Ball';
    date.textContent=`${D[n.getDay()]} ${n.getDate()} ${M[n.getMonth()]} ${n.getFullYear()+543}`;
  }
  const hm=document.getElementById('hm'),s=document.getElementById('s'),
        greet=document.getElementById('greet'),date=document.getElementById('date');
  tick();setInterval(tick,1000);

  // window controls (guard if opened in plain browser)
  const api=window.cowork;
  document.getElementById('close').onclick=()=>api&&api.close();
  let pinned=false;
  document.getElementById('pin').onclick=(e)=>{pinned=!pinned;e.target.classList.toggle('on',pinned);api&&api.pin(pinned);};
  let maxed=false;
  document.getElementById('max').onclick=(e)=>{maxed=!maxed;e.target.classList.toggle('on',maxed);api&&api.maximize();};

  // Redmine tasks, grouped by status, filtered by a multi-select project set
  function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
  const STATUS_COLOR={'In Progress':'var(--accent)','New':'var(--cyan)','Test':'var(--amber)',
    'Backlog':'var(--dim)','Resolved':'var(--green)'};
  function hashN(key,n){ let h=0; for(const c of String(key)) h=(h*31+c.charCodeAt(0))>>>0; return h%n; }
  function projColor(key){ return 'pc'+hashN(key,6); }
  function whoColor(key){ return 'wc'+hashN(key,6); }
  const RISK_ORDER=['Low','Fairly Low','Moderate','Medium','High'];
  let lastPayload=null, activeStatus=null;
  const selectedProjects=new Set();    // empty = show all projects
  const selectedAssignees=new Set();   // empty = show all assignees
  function issueMatch(i){
    return (selectedProjects.size===0 || selectedProjects.has(i.project))
        && (selectedAssignees.size===0 || selectedAssignees.has(i.assignee));
  }
  function allIssues(){ return lastPayload.groups.flatMap(g=>g.issues); }
  function statusIssues(status){
    const g=lastPayload.groups.find(g=>g.status===status);
    return (g?g.issues:[]).filter(issueMatch);
  }
  function renderPanel(){
    const el=document.getElementById('tasks');
    const issues=activeStatus==='ALL'?allIssues().filter(issueMatch):statusIssues(activeStatus);
    if(!issues.length){ el.innerHTML='<div class="hint">ไม่มีงานในสถานะนี้</div>'; return; }
    el.innerHTML='';
    issues.forEach(issue=>{
      const row=document.createElement('div');
      row.className='task';
      row.title='เปิดใน Redmine';
      const rank=RISK_ORDER.indexOf(issue.risk);
      const riskCls=rank>=0?`rk${rank}`:'rk-none';
      const riskTxt=issue.risk||'–';
      row.innerHTML=`
        <span class="idnum">#${issue.id}</span>
        <div class="t" title="${esc(issue.subject)}">${esc(issue.subject)}</div>
        <span class="proj ${projColor(issue.project)}" title="${esc(issue.project)}">${esc(issue.project)}</span>
        <span class="who ${whoColor(issue.assignee)}" title="${esc(issue.assignee)}">${esc(issue.assignee)}</span>
        <span class="risk ${riskCls}" title="Risk: ${esc(issue.risk||'ไม่ระบุ')}">${esc(riskTxt)}</span>`;
      row.onclick=()=>api&&api.openLink&&api.openLink(issue.url);
      el.appendChild(row);
    });
  }
  function renderTabs(){
    const tabsEl=document.getElementById('tabs');
    tabsEl.innerHTML='';
    // ALL tab (default) — every status combined
    const allTab=document.createElement('div');
    allTab.className='tab'+(activeStatus==='ALL'?' active':'');
    allTab.style.setProperty('--sc','var(--accent)');
    allTab.innerHTML=`<span class="dot"></span>ALL<span class="n">${allIssues().filter(issueMatch).length}</span>`;
    allTab.onclick=()=>{ activeStatus='ALL'; renderTabs(); renderPanel(); };
    tabsEl.appendChild(allTab);
    lastPayload.groups.forEach(g=>{
      const tab=document.createElement('div');
      tab.className='tab'+(g.status===activeStatus?' active':'');
      tab.style.setProperty('--sc', STATUS_COLOR[g.status]||'var(--dim)');
      tab.innerHTML=`<span class="dot"></span>${esc(g.status)}<span class="n">${statusIssues(g.status).length}</span>`;
      tab.onclick=()=>{ activeStatus=g.status; renderTabs(); renderPanel(); };
      tabsEl.appendChild(tab);
    });
  }
  function renderChipFilter(elId, keyFn, selected){
    const el=document.getElementById(elId);
    el.innerHTML='';
    const counts=new Map();
    allIssues().forEach(i=>{ const k=keyFn(i); counts.set(k,(counts.get(k)||0)+1); });
    [...counts.keys()].sort().forEach(k=>{
      const chip=document.createElement('div');
      chip.className='chip'+(selected.has(k)?' active':'');
      chip.innerHTML=`${esc(k)}<span class="n">${counts.get(k)}</span>`;
      chip.onclick=()=>{
        selected.has(k)?selected.delete(k):selected.add(k);
        renderFilters(); renderTabs(); renderPanel();
      };
      el.appendChild(chip);
    });
  }
  function renderFilters(){
    renderChipFilter('projectFilter', i=>i.project, selectedProjects);
    renderChipFilter('assigneeFilter', i=>i.assignee, selectedAssignees);
  }
  function renderTasks(payload){
    const el=document.getElementById('tasks');
    document.getElementById('tabs').innerHTML='';
    document.getElementById('projectFilter').innerHTML='';
    document.getElementById('assigneeFilter').innerHTML='';
    if(payload.error){ el.innerHTML=`<div class="hint">โหลด Redmine ไม่สำเร็จ: ${esc(payload.error)}</div>`; return; }
    if(!payload.groups || !payload.groups.length){ el.innerHTML='<div class="hint">ไม่มีงานค้าง</div>'; return; }
    lastPayload=payload;
    // drop selections that no longer exist
    const projNames=new Set(allIssues().map(i=>i.project));
    const asgNames=new Set(allIssues().map(i=>i.assignee));
    [...selectedProjects].forEach(p=>{ if(!projNames.has(p)) selectedProjects.delete(p); });
    [...selectedAssignees].forEach(a=>{ if(!asgNames.has(a)) selectedAssignees.delete(a); });
    if(!activeStatus || (activeStatus!=='ALL' && !payload.groups.some(g=>g.status===activeStatus))){
      activeStatus='ALL';
    }
    renderFilters(); renderTabs(); renderPanel();
  }
  api && api.onTasks && api.onTasks(renderTasks);

  // ===== Workspace tab =====
  const ST_META={
    active:{c:'var(--green)',t:'🟢 กำลังทำ',label:'กำลังทำ'},
    pause :{c:'var(--amber)',t:'🟡 พัก',   label:'พัก'},
    done  :{c:'var(--dim)',  t:'✅ จบแล้ว',label:'จบแล้ว'},
    unknown:{c:'var(--dim)', t:'– ไม่ระบุ',label:'ไม่ระบุ'},
  };
  const PROJ_HUES=['#9bbcff','#a6dd93','#e8c184','#f096a4','#87d6e6','#bda6f5'];
  function hueOf(key){ let h=0; for(const c of String(key)) h=(h*31+c.charCodeAt(0))>>>0; return PROJ_HUES[h%PROJ_HUES.length]; }

  let wsData=null;
  const wsVisSel=new Set();     // empty = all visibilities
  const wsStatSel=new Set();    // empty = all statuses
  function openFile(p){ api&&api.openFile&&api.openFile(p); }

  function wsProjectsFiltered(){
    if(!wsData||!wsData.projects) return [];
    return wsData.projects.filter(p=>
      (wsVisSel.size===0 || wsVisSel.has(p.visibility)) &&
      (wsStatSel.size===0 || wsStatSel.has(p.status)));
  }
  function renderWsStats(){
    const s=wsData.stats||{};
    const cells=[
      ['โปรเจกต์',s.projects,'var(--accent)'],
      ['public',s.public,'var(--cyan)'],
      ['private',s.private,'var(--violet)'],
      ['lessons',s.lessons,'var(--amber)'],
      ['playbooks',s.playbooks,'var(--green)'],
    ];
    document.getElementById('wsStats').innerHTML=cells.map(([l,n,c])=>
      `<div class="stat" style="--sc:${c}"><div class="n">${n||0}</div><div class="l">${l}</div></div>`).join('');
  }
  function renderWsFilters(){
    const ps=wsData.projects||[];
    const visEl=document.getElementById('wsVis');
    const visList=[['Public','var(--cyan)'],['Private','var(--violet)']];
    visEl.innerHTML=`<div class="chip${wsVisSel.size===0?' active':''}" data-all="1">ทั้งหมด<span class="n">${ps.length}</span></div>`+
      visList.map(([v,c])=>{
        const n=ps.filter(p=>p.visibility===v).length;
        return `<div class="chip${wsVisSel.has(v)?' active':''}" data-vis="${v}"><span class="dot" style="--cc:${c}"></span>${v}<span class="n">${n}</span></div>`;
      }).join('');
    const stEl=document.getElementById('wsStatus');
    const order=['active','pause','done','unknown'];
    stEl.innerHTML=`<div class="chip${wsStatSel.size===0?' active':''}" data-all="1">ทั้งหมด<span class="n">${ps.length}</span></div>`+
      order.filter(k=>ps.some(p=>p.status===k)).map(k=>{
        const n=ps.filter(p=>p.status===k).length;
        return `<div class="chip${wsStatSel.has(k)?' active':''}" data-stat="${k}"><span class="dot" style="--cc:${ST_META[k].c}"></span>${ST_META[k].label}<span class="n">${n}</span></div>`;
      }).join('');
    // single-select: pick one, or click the active one again to reset to "ทั้งหมด"
    visEl.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{
      const v=ch.dataset.vis;
      const only=v!==undefined && wsVisSel.size===1 && wsVisSel.has(v);
      wsVisSel.clear();
      if(v!==undefined && !only) wsVisSel.add(v);
      renderWsFilters(); renderWsProjects();
    });
    stEl.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{
      const k=ch.dataset.stat;
      const only=k!==undefined && wsStatSel.size===1 && wsStatSel.has(k);
      wsStatSel.clear();
      if(k!==undefined && !only) wsStatSel.add(k);
      renderWsFilters(); renderWsProjects();
    });
  }
  function renderWsProjects(){
    const el=document.getElementById('wsProjects');
    const list=wsProjectsFiltered();
    if(!list.length){ el.innerHTML='<div class="empty">ไม่มีโปรเจกต์ตามตัวกรองนี้</div>'; return; }
    el.innerHTML='';
    list.forEach(p=>{
      const m=ST_META[p.status]||ST_META.unknown;
      const card=document.createElement('div');
      card.className='card'; card.style.setProperty('--sc',m.c);
      card.title='เปิดหน้าสรุปโปรเจกต์';
      card.innerHTML=`
        <div class="ctop">
          <span class="sdot"></span>
          <span class="name" title="${esc(p.name)}">${esc(p.name)}</span>
          <span class="vis ${p.visibility==='Public'?'pub':'prv'}">${p.visibility}</span>
        </div>
        <div class="path" title="${esc(p.path)}">${esc(p.path)}</div>
        <div class="desc${p.desc?'':' none'}">${p.desc?esc(p.desc):'ยังไม่มีภาพรวม'}</div>
        <div class="foot">
          <span class="stag">${m.t}</span>
          <span class="upd">${p.updated?'↻ '+esc(p.updated):''}</span>
        </div>`;
      card.onclick=()=>openFile(p.file);
      el.appendChild(card);
    });
  }
  function renderWsFeed(){
    const el=document.getElementById('wsFeed');
    const days=(wsData.daily||[]).filter(d=>d.entries&&d.entries.length).slice(0,6);
    if(!days.length){ el.innerHTML='<div class="empty">ยังไม่มีบันทึกรายวัน</div>'; return; }
    el.innerHTML='';
    days.forEach(d=>{
      const day=document.createElement('div'); day.className='day';
      day.innerHTML=`<div class="dhead"><span class="ddate">${esc(d.date)}</span>
        <span class="dsub">${d.visibility==='Public'?'Public':'Private'} · ${d.entries.length} โปรเจกต์อัปเดต</span></div>`;
      d.entries.forEach(e=>{
        const en=document.createElement('div'); en.className='entry';
        en.style.setProperty('--pc',hueOf(e.project));
        en.title='เปิดไฟล์บันทึกรายวัน';
        en.innerHTML=`<div class="rail"><span class="pin"></span><span class="ln"></span></div>
          <div class="content"><div class="pname">${esc(e.project)}</div><div class="ptext">${esc(e.text)}</div></div>`;
        en.onclick=()=>openFile(d.file);
        day.appendChild(en);
      });
      el.appendChild(day);
    });
  }
  function renderWsKnow(){
    const el=document.getElementById('wsKnow');
    const items=[
      ...(wsData.lessons||[]).map(x=>({...x,type:'les'})),
      ...(wsData.playbooks||[]).map(x=>({...x,type:'pbk'})),
    ].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    if(!items.length){ el.innerHTML='<div class="empty">ยังไม่มีบทเรียน/แผนรับมือ (มีแต่ template)</div>'; return; }
    el.innerHTML='';
    items.forEach(k=>{
      const c=document.createElement('div'); c.className='lcard'+(k.type==='pbk'?' pb':'');
      c.title='เปิดไฟล์';
      c.innerHTML=`<div class="lt"><span class="badge ${k.type==='les'?'les':'pbk'}">${k.type==='les'?'Lesson':'Playbook'}</span>
        <span class="ldate">${esc(k.date||'')}</span></div>
        <div class="lname">${esc(k.name)}</div>
        ${k.meta?`<div class="lmeta">${esc(k.meta)}</div>`:''}`;
      c.onclick=()=>openFile(k.file);
      el.appendChild(c);
    });
  }
  function renderWorkspace(payload){
    wsData=payload;
    const proj=document.getElementById('wsProjects');
    if(!payload || payload.error){
      proj.innerHTML=`<div class="empty">โหลด Workspace ไม่สำเร็จ: ${esc((payload&&payload.error)||'ไม่ทราบสาเหตุ')}</div>`;
      document.getElementById('wsStats').innerHTML='';
      document.getElementById('wsVis').innerHTML='';
      document.getElementById('wsStatus').innerHTML='';
      document.getElementById('wsFeed').innerHTML='';
      document.getElementById('wsKnow').innerHTML='';
      return;
    }
    // drop selections no longer present
    const vises=new Set((payload.projects||[]).map(p=>p.visibility));
    const stats=new Set((payload.projects||[]).map(p=>p.status));
    [...wsVisSel].forEach(v=>{ if(!vises.has(v)) wsVisSel.delete(v); });
    [...wsStatSel].forEach(s=>{ if(!stats.has(s)) wsStatSel.delete(s); });
    renderWsStats(); renderWsFilters(); renderWsProjects(); renderWsFeed(); renderWsKnow();
  }
  api && api.onWorkspace && api.onWorkspace(renderWorkspace);

  // tab switching
  const navR=document.getElementById('navRedmine'), navW=document.getElementById('navWorkspace'),
        viewR=document.getElementById('redmineView'), viewW=document.getElementById('workspaceView'),
        wsRefresh=document.getElementById('wsRefresh');
  function showTab(which){
    const ws=which==='ws';
    viewW.classList.toggle('hidden',!ws); viewR.classList.toggle('hidden',ws);
    navW.classList.toggle('on',ws); navR.classList.toggle('on',!ws);
    wsRefresh.classList.toggle('hidden',!ws);
  }
  navR.onclick=()=>showTab('rm');
  navW.onclick=()=>showTab('ws');
  wsRefresh.onclick=()=>api&&api.refreshWorkspace&&api.refreshWorkspace();
</script>
</body>
</html>
